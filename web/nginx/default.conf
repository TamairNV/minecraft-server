# Front door: the site at /, BlueMap at /map/. Cloudflare Access guards the whole
# hostname and the app checks the token again. The map can't check it itself, so
# nginx asks the app first.
resolver 127.0.0.11 valid=30s;
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /_authz {
        internal;
        set $web web:8000;
        proxy_pass http://$web/authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location /map/ {
        auth_request /_authz;
        limit_except GET HEAD { deny all; }
        set $bluemap crafty:8100;
        rewrite ^/map/(.*)$ /$1 break;
        proxy_pass http://$bluemap;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location = /map { return 301 /map/; }

    location /admin/api/ {
        set $web web:8000;
        proxy_pass http://$web;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        limit_except GET HEAD { deny all; }
        set $web web:8000;
        proxy_pass http://$web;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
